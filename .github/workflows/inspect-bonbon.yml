name: Inspect BonBon-Land calendar markup
on:
  push:
    paths:
      - '.github/workflows/inspect-bonbon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect calendar data markers
        run: |
          python - <<'PY'
          import urllib.request,re,html,json
          u='https://www.bonbonland.dk/en/abningstider-og-priser/abningstider'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          print('bytes',len(raw))
          for term in ['2026-10-26','2026-10','calendar','openingDays','agenda','schedule','fullcalendar','datePicker','dayEvents','openingHours','api/','hours']:
           matches=list(re.finditer(re.escape(term),raw,re.I))
           print('TERM',term,'COUNT',len(matches))
           for m in matches[:3]:
            print(re.sub(r'\\s+',' ',html.unescape(raw[max(0,m.start()-150):m.end()+240]))[:400])
          for src in re.findall(r'<script[^>]+src=["\\']([^"\\']+)',raw,re.I):
           if any(x in src.lower() for x in ['calendar','agenda','main','bundle','park','opening']):print('SCRIPT',src[:200])
          PY
