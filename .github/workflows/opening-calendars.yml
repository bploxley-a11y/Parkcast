name: Update ParkCast opening calendars
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve published schedules
        run: python scripts/update_calendars.py
      - name: Monitor recent weather-related media coverage
        run: python scripts/update_media.py
      - name: Commit updated schedule data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opening_calendars.json data/opening_calendar_diagnostics.json data/media_weather.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh ParkCast opening calendars'
            git push
          fi
